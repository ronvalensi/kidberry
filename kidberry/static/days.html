<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kidberry Days</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f6fdb; --accent-soft: #e6eefc; --band: #eef3fb;
    /* sound categories: validated categorical slots 1-4 (light) */
    --s-crying: #2a78d6; --s-screaming: #eb6834; --s-yelling: #1baf7a; --s-impact: #eda100;
    /* severity: one-hue sequential ramp, light -> dark = low -> high */
    --sev1: #f0a39a; --sev2: #e57a6f; --sev3: #d6453d; --sev4: #b02a24; --sev5: #7d1712;
    --bar: #86b6ef;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #8b93a5; --line: #2c323d;
      --accent: #6b9cff; --accent-soft: #24304a; --band: #222a38;
      --s-crying: #3987e5; --s-screaming: #d95926; --s-yelling: #199e70; --s-impact: #c98500;
      --sev1: #6e2f2b; --sev2: #9c3b35; --sev3: #d6453d; --sev4: #f0736a; --sev5: #ffa59e;
      --bar: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: var(--accent); text-decoration: none; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .pattern { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .pattern:first-of-type { border-top: 0; }
  .sev { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; font-weight: 600; font-size: 12px; color: #fff; }
  .sev.s1, .sev.s2 { color: var(--text); }
  .pattern .title { font-weight: 600; }
  .pattern .links a { color: var(--accent); margin-right: 10px; font-size: 12px; text-decoration: none; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num { text-align: right; }
  .cellbar { display: flex; align-items: center; gap: 8px; }
  .cellbar .b { height: 8px; border-radius: 0 4px 4px 0; background: var(--bar); min-width: 2px; }
  .cellbar span { min-width: 34px; text-align: right; }
  td a { color: var(--accent); text-decoration: none; margin-right: 8px; }
  /* time-of-day grid */
  .grid { position: relative; }
  .axis, .row { display: grid; grid-template-columns: 96px 1fr; align-items: center; }
  .axis .ticks { position: relative; height: 18px; }
  .axis .ticks span { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
  .row { height: 34px; border-top: 1px solid var(--line); }
  .row .lbl { font-size: 12px; }
  .track { position: relative; height: 100%; }
  .track .hours { position: absolute; top: 3px; bottom: 3px; background: var(--band); border-radius: 3px; }
  .track .gridline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .track .snd { position: absolute; bottom: 5px; height: 7px; min-width: 3px; border-radius: 2px; }
  .track .fl { position: absolute; width: 8px; margin-left: -4px; bottom: 14px; border-radius: 4px 4px 0 0;
               box-shadow: 0 0 0 2px var(--panel); cursor: pointer; }
  .track .hit { position: absolute; top: 0; bottom: 0; width: 14px; margin-left: -7px; cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--text); border: 1px solid var(--line);
         border-radius: 6px; padding: 8px 10px; font-size: 12px; max-width: 340px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; z-index: 10; }
  #tip .q { direction: auto; color: var(--muted); margin-top: 4px; }
  @media (max-width: 640px) { .axis, .row { grid-template-columns: 64px 1fr; } }
</style>
</head>
<body>
<header><h1>Kidberry · Days</h1><a href="/">← Recordings</a><span class="muted" id="sub"></span></header>
<main>
  <section><h2>Patterns across days</h2><div id="patterns" class="muted">Loading…</div></section>
  <section><h2>Time of day</h2>
    <div class="muted" style="font-size:12px;margin-bottom:6px">Each row is a day. Shaded = kindergarten hours. Bars on top = flags (taller and darker = more severe), strip below = detected sounds. Click a flag to listen.</div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--s-crying)"></i>Crying</span><span><i style="background:var(--s-screaming)"></i>Screaming</span>
      <span><i style="background:var(--s-yelling)"></i>Yelling</span><span><i style="background:var(--s-impact)"></i>Impact</span>
      <span>Flag severity: <i style="background:var(--sev1)"></i>1 <i style="background:var(--sev3)"></i>3 <i style="background:var(--sev5)"></i>5</span>
    </div>
  </section>
  <section><h2>Per day</h2><div class="tablewrap"><table id="table"></table></div></section>
</main>
<div id="tip"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LABELS = { physical: 'Physical harm', threat: 'Threat / intimidation', insult: 'Insult / humiliation', secrecy: 'Secrecy',
  neglect: 'Neglect / deprivation', distress: 'Child distress', profanity: 'Bad language', crying: 'Long crying',
  screaming: 'Screaming', yelling: 'Yelling', impact: 'Impact sound', other: 'Other' };
const RESP = { yes: 'adult responded', no: 'no adult heard responding', unclear: 'adult response unclear' };
const T0 = 7.5 * 60, T1 = 16.5 * 60;                                   // 07:30 - 16:30
const pct = m => ((Math.min(Math.max(m, T0), T1) - T0) / (T1 - T0) * 100) + '%';
const hm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`;
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const dayName = d => new Date(d + 'T12:00').toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
const listen = f => `/#r=${f.rec}&t=${Math.max(0, Math.floor(f.start))}`;
let flagById = {};

function tip(e, html) { const t = $('#tip'); t.innerHTML = html; t.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - t.offsetHeight - 8);
  t.style.left = x + 'px'; t.style.top = y + 'px'; }
function untip() { $('#tip').style.display = 'none'; }

function renderPatterns(data) {
  const box = $('#patterns');
  if (!data.patterns.length) {
    const n = data.school_days.length;
    box.innerHTML = `No patterns found. ${n} kindergarten day${n === 1 ? '' : 's'} with hours set so far; a pattern needs
      something to repeat on ${data.needed} of the last ${data.look_back} days. Keep recording — this fills in over the coming weeks.`;
    return;
  }
  box.classList.remove('muted');
  box.innerHTML = data.patterns.map(p => `<div class="pattern">
      <span class="sev s${p.severity}" style="background:var(--sev${p.severity})">${p.severity}</span>
      <div><div class="title">${esc(p.title)}</div><div class="muted">${esc(p.detail)} · ${p.days.map(dayName).join(', ')}</div>
        <div class="links">${p.flags.slice(0, 12).map(id => flagById[id]).filter(Boolean)
          .map(f => `<a href="${listen(f)}">▶ ${dayName(f.day)} ${f.clock}</a>`).join('')}</div></div></div>`).join('');
}

function renderGrid(days) {
  const ticks = []; for (let h = 8; h <= 16; h++) ticks.push(`<span style="left:${pct(h * 60)}">${String(h).padStart(2, '0')}:00</span>`);
  const lines = []; for (let h = 8; h <= 16; h++) lines.push(`<div class="gridline" style="left:${pct(h * 60)}"></div>`);
  $('#grid').innerHTML = `<div class="axis"><span></span><div class="ticks">${ticks.join('')}</div></div>` + days.map(d => {
    const band = d.hours ? `<div class="hours" style="left:${pct(toMin(d.hours[0]))};width:calc(${pct(toMin(d.hours[1]))} - ${pct(toMin(d.hours[0]))})"></div>` : '';
    const snd = d.sounds.map(s => `<div class="snd" style="left:${pct(s.minute)};width:${(s.duration / 60) / (T1 - T0) * 100}%;background:var(--s-${s.group})"></div>`).join('');
    const fl = d.flags.map(f => `<div class="fl" style="left:${pct(f.minute)};height:${6 + f.severity * 3}px;background:var(--sev${f.severity})"></div>
      <a class="hit" href="${listen(f)}" data-f="${f.id}" style="left:${pct(f.minute)}"></a>`).join('');
    return `<div class="row"><span class="lbl">${dayName(d.day)}${d.hours ? '' : ' <span class="muted">(no hours)</span>'}</span>
      <div class="track">${band}${lines.join('')}${snd}${fl}</div></div>`;
  }).join('');
  document.querySelectorAll('.hit').forEach(a => {
    a.onmousemove = e => { const f = flagById[a.dataset.f];
      tip(e, `<b>${f.clock} · ${esc(LABELS[f.category] || f.category)}</b> · severity ${f.severity} · ${f.source}
        ${f.adult_response ? `<br>${RESP[f.adult_response]}` : ''}<br>${esc(f.reason)}${f.quote ? `<div class="q" dir="auto">“${esc(f.quote)}”</div>` : ''}`); };
    a.onmouseleave = untip;
  });
}

function renderTable(days) {
  const maxF = Math.max(1, ...days.map(d => d.flag_count)), maxC = Math.max(1, ...days.map(d => d.crying_minutes));
  const bar = (v, max, unit = '') => `<div class="cellbar"><span>${v}${unit}</span><div class="b" style="width:${v / max * 120}px"></div></div>`;
  $('#table').innerHTML = `<tr><th>Day</th><th>Hours</th><th>Flags</th><th>Max sev.</th><th>Crying (min)</th>
      <th>Longest crying</th><th>No adult response</th><th>Bad language</th><th>Marked concerning</th><th>Recordings</th></tr>`
    + [...days].reverse().map(d => `<tr><td>${dayName(d.day)}</td><td>${d.hours ? d.hours.join('–') : '<span class="muted">not set</span>'}</td>
      <td>${bar(d.flag_count, maxF)}</td>
      <td class="num">${d.max_severity ? `<span class="sev s${d.max_severity}" style="background:var(--sev${d.max_severity})">${d.max_severity}</span>` : '–'}</td>
      <td>${bar(d.crying_minutes, maxC)}</td><td class="num">${d.longest_crying_minutes} min</td>
      <td class="num">${d.unattended_crying}</td><td class="num">${d.profanity}</td><td class="num">${d.concerning}</td>
      <td>${d.recordings.map(r => `<a href="/#r=${r.id}">${new Date(r.started_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</a>`).join('')}</td></tr>`).join('');
}

fetch('/api/days').then(r => r.json()).then(data => {
  for (const d of data.days) for (const f of d.flags) flagById[f.id] = { ...f, day: d.day };
  $('#sub').textContent = `${data.days.length} day${data.days.length === 1 ? '' : 's'} recorded`;
  renderPatterns(data); renderGrid(data.days); renderTable(data.days);
});
</script>
</body>
</html>
