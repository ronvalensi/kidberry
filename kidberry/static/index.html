<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kidberry</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f6fdb; --accent-soft: #e6eefc; --speech: #9db7e6; --hit: #fff2b3;
    --sev1: #c9a227; --sev3: #e07b1f; --sev5: #d6453d; --flag-soft: #fdecea; --ok: #2e8b57;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #8b93a5; --line: #2c323d;
      --accent: #6b9cff; --accent-soft: #24304a; --speech: #3e5a8c; --hit: #5a4b10;
      --sev1: #d8b440; --sev3: #f0913a; --sev5: #ff6b61; --flag-soft: #3a2224; --ok: #4fc283; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text);
    display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 5px; padding: 2px 8px; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside h1 { font-size: 18px; margin: 0; padding: 16px; border-bottom: 1px solid var(--line); }
  .search-all { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; }
  #recs, #globalResults { overflow-y: auto; flex: 1; }
  .rec { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .rec:hover { background: var(--accent-soft); }
  .rec.active { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 13px; }
  .rec .name { font-weight: 600; word-break: break-all; }
  .rec .meta { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--line); }
  .sev { display: inline-block; min-width: 20px; text-align: center; font-size: 11px; font-weight: 700; color: #fff;
    border-radius: 8px; padding: 0 6px; }
  .s1, .s2 { background: var(--sev1); } .s3, .s4 { background: var(--sev3); } .s5 { background: var(--sev5); }
  .hit { padding: 8px 16px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .hit:hover { background: var(--accent-soft); }
  .hit .meta { color: var(--muted); font-size: 11px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .player { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 20px; }
  .player h2 { margin: 0 0 8px; font-size: 15px; word-break: break-all; }
  audio { width: 100%; }
  #timeline { position: relative; height: 34px; margin-top: 8px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 4px; cursor: pointer; overflow: hidden; }
  #timeline .sp { position: absolute; top: 10px; bottom: 10px; background: var(--speech); }
  #timeline .fl { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; }
  #timeline .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .said { margin-top: 6px; font-size: 13px; }
  .said summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  .said.empty-said { color: var(--muted); font-size: 12px; }
  .said-line { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
  .said-line:hover { background: var(--accent-soft); }
  .said-line.during { border-left: 3px solid #e0a030; padding-left: 6px; }
  .said-line .ts { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .said-line .tag { color: var(--muted); font-size: 10px; text-transform: uppercase; white-space: nowrap; }
  #timeline .snd { position: absolute; bottom: 0; height: 7px; min-width: 2px; opacity: .85; }
  #timeline .snd.crying { background: #e0a030; } #timeline .snd.screaming { background: #d0402a; }
  #timeline .snd.yelling { background: #b03090; } #timeline .snd.impact { background: #555; }
  .tools { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .tools input[type=search] { max-width: 280px; }
  .tools label { color: var(--muted); font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  #flagsPanel { background: var(--panel); border-bottom: 1px solid var(--line); max-height: 34vh; overflow-y: auto; }
  #flagsPanel summary { padding: 8px 20px; cursor: pointer; font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  .flag { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; padding: 7px 20px; border-top: 1px solid var(--line); align-items: start; }
  .flag:hover { background: var(--accent-soft); }
  .flag.false_alarm { opacity: .45; }
  .flag .ts { color: var(--accent); cursor: pointer; font-variant-numeric: tabular-nums; font-size: 12px; }
  .flag .cat { font-weight: 600; font-size: 13px; }
  .flag .src { color: var(--muted); font-size: 11px; margin-inline-start: 6px; }
  .flag .reason { font-size: 13px; }
  .flag .quote { font-size: 13px; color: var(--muted); }
  .flag .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .flag .acts .concerning.on { background: var(--sev5); border-color: var(--sev5); }
  .flag .acts .false_alarm.on { background: var(--ok); border-color: var(--ok); }
  #transcript { overflow-y: auto; flex: 1; padding: 8px 20px 40px; }
  .seg { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 5px 8px; border-radius: 5px; cursor: pointer;
    border-left: 3px solid transparent; }
  .seg:hover { background: var(--accent-soft); }
  .seg.now { background: var(--accent-soft); outline: 1px solid var(--accent); }
  .seg.target { outline: 2px solid var(--sev3); outline-offset: -1px; }
  .seg.flagged { border-left-color: var(--sev5); background: var(--flag-soft); }
  .seg.lowconf .main { opacity: .55; }
  .seg.filtered .main { opacity: .4; text-decoration: line-through; }
  .seg.outside { opacity: .5; }
  .seg .ts { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 2px; }
  .seg .clock { display: block; color: var(--muted); font-size: 11px; }
  .seg .heard { display: block; color: var(--muted); font-size: 12px; }
  .en { display: block; color: var(--accent); font-size: 12px; font-style: italic; text-align: left; }
  .seg .tag { color: var(--muted); font-size: 10px; text-transform: uppercase; margin-inline-start: 6px; }
  .seg .why { color: var(--sev5); font-size: 10px; margin-inline-start: 6px; }
  .seg mark { background: var(--hit); color: inherit; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .seg.named { border-left-color: var(--accent); }
  .namebadge { font-size: 11px; font-weight: 600; color: var(--accent); margin-inline-start: 6px; white-space: nowrap; }
  .namebadge.maybe { color: var(--muted); font-weight: 400; }
  mark.nm { background: var(--accent-soft); outline: 1px solid var(--accent); border-radius: 3px; }
  #timeline .nmk { position: absolute; top: 0; width: 2px; height: 7px; background: var(--accent); }
  #nameBtn { display: block; width: 100%; margin-top: 8px; padding: 7px 10px; text-align: start; cursor: pointer; }
  .hit.day { color: var(--muted); font-size: 11px; font-weight: 600; margin-top: 8px; cursor: default; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 35vh 1fr; }
    .flag { grid-template-columns: 60px 1fr; } .flag .acts { grid-column: 2; justify-content: flex-start; } }
</style>
</head>
<body>
<aside>
  <h1>Kidberry</h1>
  <a href="/days" style="display:block;margin:-4px 0 10px;color:var(--accent);text-decoration:none">📅 Days overview &amp; patterns →</a>
  <div class="search-all"><input id="qAll" type="search" placeholder="Search all recordings…" dir="auto">
    <button id="nameBtn" title="Every line where his name, or something that sounds like it, is said">👦 Every time his name is said</button></div>
  <div id="recs"></div>
  <div id="globalResults" hidden></div>
</aside>
<main>
  <div class="player">
    <h2 id="title">Select a recording</h2>
    <audio id="audio" controls preload="metadata"></audio>
    <div id="timeline" title="Blue = speech, tall colored marks = flags, bottom strip = sounds (orange crying, red screaming, purple yelling, grey impact). Click to jump."></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Filter this transcript…" dir="auto">
      <label><input id="follow" type="checkbox" checked> Follow playback</label>
      <label title="Show the AI's best guess of what was said; the recognizer's raw text is shown underneath"><input id="useCorrected" type="checkbox" checked> AI-corrected text</label>
      <label><input id="flaggedOnly" type="checkbox"> Flagged lines only</label>
      <label title="Lines where his name, or something that sounds like it, is said"><input id="namedOnly" type="checkbox"> <span id="namedLabel">His name only</span></label>
      <label title="Lines the filter thinks Whisper invented (e.g. 'תודה רבה', Knesset phrases)"><input id="showFiltered" type="checkbox"> Show filtered</label>
      <label title="Play the untouched recorder file instead of the volume-boosted copy"><input id="original" type="checkbox"> Original audio</label>
      <span class="hint">Click a line to play from 3s before · Space play/pause · ←/→ 5s</span>
    </div>
  </div>
  <details id="flagsPanel" open hidden><summary id="flagsSummary"></summary><div id="flagsList"></div></details>
  <div id="transcript"><div class="empty">Transcribe recordings first, then pick one on the left.</div></div>
</main>
<script>
const $ = s => document.querySelector(s);
const audio = $('#audio');
const CATS = { physical: 'Physical harm', threat: 'Threat / intimidation', insult: 'Insult / humiliation',
  secrecy: 'Secrecy', neglect: 'Neglect / deprivation', distress: 'Child distress', other: 'Other',
  profanity: 'Bad language near children', crying: 'Crying', screaming: 'Screaming', yelling: 'Yelling / shouting', impact: 'Slap / impact sound' };
const SRC = { ai: 'AI review', keyword: 'keyword', sound: 'sound' };
let recs = [], current = null, segs = [], flags = [], soundEvents = [], segEls = [], nowIdx = -1, flaggedSeg = new Map();

const fmt = t => { t = Math.max(0, Math.floor(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hl = (text, q) => { const t = esc(text); if (!q) return t;
  return t.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); };
const lowConf = s => s.no_speech_prob > 0.6 || s.avg_logprob < -1.0;
const clock = (rec, t) => rec?.started_at
  ? new Date(new Date(rec.started_at).getTime() + t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
  : '';
const startedLabel = r => r.started_at ? new Date(r.started_at).toLocaleString() : new Date(r.file_mtime * 1000).toLocaleString();
const audioUrl = id => `/api/recordings/${id}/audio${$('#original').checked ? '?original=true' : ''}`;
const sevColor = s => getComputedStyle(document.documentElement).getPropertyValue(s >= 5 ? '--sev5' : s >= 3 ? '--sev3' : '--sev1');
const activeFlags = () => flags.filter(f => f.review !== 'false_alarm');

async function loadRecs() {
  recs = await (await fetch('/api/recordings')).json();
  $('#recs').innerHTML = recs.length ? recs.map(r => `
    <div class="rec${current?.id === r.id ? ' active' : ''}" data-id="${r.id}">
      <div class="name">${esc(r.name)}</div>
      <div class="meta">${startedLabel(r)} · ${r.duration ? fmt(r.duration) : '—'}
        · <span class="badge">${r.status}</span>
        ${r.flag_count ? `<span class="sev s${r.max_severity}">${r.flag_count} flag${r.flag_count > 1 ? 's' : ''}</span>` : ''}</div>
    </div>`).join('') : '<div class="empty">No recordings yet.</div>';
  document.querySelectorAll('.rec').forEach(el => el.onclick = () => openRec(+el.dataset.id));
}

async function openRec(id, seekTo) {
  current = recs.find(r => r.id === id);
  document.querySelectorAll('.rec').forEach(el => el.classList.toggle('active', +el.dataset.id === id));
  $('#title').textContent = current.name;
  [segs, flags, soundEvents] = await Promise.all([
    fetch(`/api/recordings/${id}/segments`).then(r => r.json()),
    fetch(`/api/recordings/${id}/flags`).then(r => r.json()),
    fetch(`/api/recordings/${id}/sounds`).then(r => r.json()),
  ]);
  audio.src = audioUrl(id);
  nowIdx = -1;
  renderAll();
  if (seekTo != null) playFrom(seekTo);
  history.replaceState(null, '', `#r=${id}`);
}

function renderAll() {
  flaggedSeg = new Map();
  for (const f of activeFlags()) for (const sid of JSON.parse(f.segment_ids || '[]'))
    flaggedSeg.set(sid, Math.max(flaggedSeg.get(sid) || 0, f.severity));
  renderFlags(); renderTranscript(); renderTimeline();
}

function renderFlags() {
  const panel = $('#flagsPanel');
  panel.hidden = !current;
  if (!current) return;
  const act = activeFlags();
  $('#flagsSummary').textContent = flags.length
    ? `Flags: ${act.length} to review${flags.length > act.length ? ` · ${flags.length - act.length} marked false alarm` : ''}`
    : (current.status === 'done' ? 'No flags in this recording' : 'Not analyzed yet');
  const sorted = [...flags].sort((a, b) => (a.review === 'false_alarm') - (b.review === 'false_alarm') || b.severity - a.severity || a.start - b.start);
  $('#flagsList').innerHTML = sorted.map(f => `
    <div class="flag ${f.review || ''}" data-id="${f.id}">
      <div><span class="ts" data-t="${f.start}">▶ ${fmt(f.start)}</span><br><span class="sev s${f.severity}">${f.severity}</span></div>
      <div><span class="cat">${esc(CATS[f.category] || f.category)}</span><span class="src">${SRC[f.source] || f.source}</span>
        <div class="reason">${esc(f.reason)}</div>
        ${f.quote ? `<div class="quote" dir="auto">“${esc(f.quote)}”</div>` : ''}
        ${f.source === 'sound' ? saidAround(f) : ''}</div>
      <div class="acts">
        <button class="concerning${f.review === 'concerning' ? ' on' : ''}" data-v="concerning">Concerning</button>
        <button class="false_alarm${f.review === 'false_alarm' ? ' on' : ''}" data-v="false_alarm">False alarm</button>
      </div>
    </div>`).join('');
  $('#flagsList').querySelectorAll('.flag').forEach(el => {
    el.querySelector('.ts').onclick = () => { const f = flags.find(x => x.id === +el.dataset.id); showInTranscript(f); playFrom(f.start); };
    el.querySelectorAll('button').forEach(b => b.onclick = () => setReview(+el.dataset.id, b.dataset.v));
    el.querySelectorAll('.said-line').forEach(l => l.onclick = () => playFrom(+l.dataset.t));
  });
}

// What was said around a sound event (1 min before until 30 s after): shows how the adults reacted.
const SAID_BEFORE = 60, SAID_AFTER = 30;
function saidAround(f) {
  const useCorr = $('#useCorrected').checked;
  const lines = segs.filter(s => !s.filtered && s.end > f.start - SAID_BEFORE && s.start < f.end + SAID_AFTER);
  const head = `What was said from 1 min before until 30 s after (${lines.length} line${lines.length === 1 ? '' : 's'})`;
  if (!lines.length) return `<div class="said empty-said">${head}: nothing intelligible. No speech nearby can itself be telling.</div>`;
  return `<details class="said"><summary>${head}</summary>${lines.map(s => {
    const during = s.end > f.start && s.start < f.end;
    const text = useCorr && s.corrected ? s.corrected : s.text;
    return `<div class="said-line${during ? ' during' : ''}" data-t="${s.start}">
      <span class="ts">${clock(current, s.start) || fmt(s.start)}</span>
      <span><span dir="auto">${esc(text)}</span>${s.translation ? `<span class="en" dir="ltr">EN: ${esc(s.translation)}</span>` : ''}</span><span class="tag">${s.language || ''}${during ? ' · during' : s.start < f.start ? ' · before' : ' · after'}</span></div>`;
  }).join('')}</details>`;
}

async function setReview(id, value) {
  const f = flags.find(x => x.id === id);
  const review = f.review === value ? null : value;   // clicking again clears it
  await fetch(`/api/flags/${id}/review`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ review }) });
  f.review = review;
  renderAll(); loadRecs();
}

function renderTranscript() {
  const q = $('#q').value.trim().toLowerCase(), showFiltered = $('#showFiltered').checked,
        useCorr = $('#useCorrected').checked, flaggedOnly = $('#flaggedOnly').checked, namedOnly = $('#namedOnly').checked;
  const box = $('#transcript');
  if (!segs.length) { box.innerHTML = `<div class="empty">${current.status === 'done' ? 'No speech detected.' : 'Not transcribed yet (' + current.status + ').'}</div>`; segEls = []; return; }
  box.innerHTML = segs.map((s, i) => {
    const corr = useCorr && s.corrected && s.corrected !== s.text ? s.corrected : null;
    const shown = corr || s.text;
    const show = (!q || s.text.toLowerCase().includes(q) || (s.corrected || '').toLowerCase().includes(q)
        || (s.translation || '').toLowerCase().includes(q))
      && (showFiltered || !s.filtered) && (!flaggedOnly || flaggedSeg.has(s.id)) && (!namedOnly || s.mention);
    if (!show) return '';
    const outside = current.school_from != null && (s.start < current.school_from || s.start >= current.school_to);
    const cls = (flaggedSeg.has(s.id) ? ' flagged' : '') + (s.filtered ? ' filtered' : lowConf(s) ? ' lowconf' : '')
      + (outside ? ' outside' : '') + (s.mention ? ' named' : '');
    const conf = corr && s.corrected_confidence !== 'high' ? `<span class="tag">AI guess · ${esc(s.corrected_confidence)}</span>` : '';
    return `<div class="seg${cls}" data-i="${i}">
      <span class="ts">${fmt(s.start)}<span class="clock">${clock(current, s.start)}</span></span>
      <span><span class="main" dir="auto">${hlName(hl(shown, q))}</span><span class="tag">${s.language || ''}</span>${conf}${nameBadge(s.mention)}
        ${s.filtered ? `<span class="why">${esc(s.filtered)}</span>` : ''}
        ${outside ? `<span class="tag">outside kindergarten hours</span>` : ''}
        ${s.translation ? `<span class="en" dir="ltr">EN: ${hl(s.translation, q)}</span>` : ''}
        ${corr ? `<span class="heard" dir="auto">heard: ${hlName(hl(s.text, q))}</span>` : ''}</span></div>`;
  }).join('') || '<div class="empty">No matching lines.</div>';
  segEls = [];
  box.querySelectorAll('.seg').forEach(el => { segEls[+el.dataset.i] = el; el.onclick = () => playFrom(segs[+el.dataset.i].start); });
}

function renderTimeline() {
  const dur = current.duration || (segs.length ? segs[segs.length - 1].end : 0);
  const tl = $('#timeline');
  if (!dur) { tl.innerHTML = ''; return; }
  const pct = t => (t / dur * 100) + '%';
  tl.innerHTML = segs.filter(s => !s.filtered).map(s => `<div class="sp" style="left:${pct(s.start)};width:${pct(Math.max(s.end - s.start, dur / 2000))}"></div>`).join('')
    + soundEvents.map(e => `<div class="snd ${e.group}" style="left:${pct(e.start)};width:${pct(e.end - e.start)}" title="${esc(fmt(e.start) + ' ' + (CATS[e.group] || e.group) + ' ' + Math.round(e.end - e.start) + 's')}"></div>`).join('')
    + segs.filter(s => s.mention && !s.filtered).map(s => `<div class="nmk" style="left:${pct(s.start)}" title="${esc(fmt(s.start) + ' ' + childName + ': ' + (s.corrected || s.text))}"></div>`).join('')
    + activeFlags().map(f => `<div class="fl" style="left:${pct(f.start)};background:${sevColor(f.severity)}" title="${esc(fmt(f.start) + ' ' + (CATS[f.category] || '') + ': ' + f.reason)}"></div>`).join('')
    + '<div class="ph" id="ph"></div>';
  tl.onclick = e => { const r = tl.getBoundingClientRect(); playFrom((e.clientX - r.left) / r.width * dur, 0); };
}

function playFrom(t, preroll = 3) { audio.currentTime = Math.max(0, t - preroll); audio.play(); }

// Scroll the transcript to an alert: its own lines if it has them, else the shown line nearest its time.
function showInTranscript(f) {
  const ids = new Set(JSON.parse(f.segment_ids || '[]'));
  let shown = segEls.map((el, i) => el && { el, s: segs[i] }).filter(Boolean);
  if (!shown.length) return;
  let targets = shown.filter(x => ids.has(x.s.id));
  if (!targets.length) {
    const inside = shown.filter(x => x.s.end > f.start && x.s.start < f.end);
    targets = inside.length ? inside
      : [shown.reduce((a, b) => Math.abs(b.s.start - f.start) < Math.abs(a.s.start - f.start) ? b : a)];
  }
  document.querySelectorAll('.seg.target').forEach(el => el.classList.remove('target'));
  targets.forEach(x => x.el.classList.add('target'));
  targets[0].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  holdFollowUntil = Date.now() + 4000;   // don't let follow-playback yank it away during the 3 s pre-roll
}
let holdFollowUntil = 0;

audio.ontimeupdate = () => {
  const t = audio.currentTime, dur = current?.duration || audio.duration;
  const ph = $('#ph'); if (ph && dur) ph.style.left = (t / dur * 100) + '%';
  const i = segs.findIndex(s => s.start <= t && t < s.end + 0.3);
  if (i === nowIdx) return;
  segEls[nowIdx]?.classList.remove('now');
  nowIdx = i;
  const el = segEls[i];
  if (el) { el.classList.add('now'); if ($('#follow').checked && Date.now() > holdFollowUntil) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
};

['#q'].forEach(s => $(s).oninput = renderTranscript);
['#showFiltered', '#useCorrected', '#flaggedOnly', '#namedOnly'].forEach(s => $(s).onchange = renderTranscript);
$('#original').onchange = () => {
  if (!current) return;
  const t = audio.currentTime, playing = !audio.paused;
  audio.src = audioUrl(current.id);
  audio.addEventListener('loadedmetadata', () => { audio.currentTime = t; if (playing) audio.play(); }, { once: true });
};

let gTimer;
$('#qAll').oninput = () => { clearTimeout(gTimer); gTimer = setTimeout(globalSearch, 250); };
async function globalSearch() {
  const q = $('#qAll').value.trim(), out = $('#globalResults');
  $('#recs').hidden = !!q; out.hidden = !q;
  if (!q) return;
  const hits = await (await fetch('/api/search?q=' + encodeURIComponent(q))).json();
  out.innerHTML = hits.length ? hits.map((h, i) => `<div class="hit" data-i="${i}"><div class="meta">${esc(h.name)} · ${fmt(h.start)}</div><div dir="auto">${hl(h.text, q)}</div></div>`).join('')
    : '<div class="empty">No matches.</div>';
  out.querySelectorAll('.hit').forEach(el => el.onclick = () => { const h = hits[+el.dataset.i]; openRec(h.recording_id, h.start); });
}

// The child's name: highlighted in every line, its own filter, and a list across all recordings.
let childName = 'his name', nameRe = null;
fetch('/api/name').then(r => r.json()).then(n => {
  childName = n.name; nameRe = new RegExp(n.pattern, 'gi');
  $('#nameBtn').textContent = `👦 Every time ${n.name} is said`; $('#namedLabel').textContent = `${n.name} only`;
  if (current) renderTranscript();
});
const hlName = html => nameRe ? html.replace(nameRe, m => `<mark class="nm">${m}</mark>`) : html;
const nameBadge = m => m === 'name' ? `<span class="namebadge">👦 ${esc(childName)}</span>`
  : m === 'maybe' ? `<span class="namebadge maybe" title="Sounds like his name; listen to check">👦 ${esc(childName)}?</span>` : '';
$('#nameBtn').onclick = async () => {
  const out = $('#globalResults');
  $('#qAll').value = ''; $('#recs').hidden = true; out.hidden = false;
  const hits = await (await fetch('/api/mentions')).json();
  const sure = hits.filter(h => h.mention === 'name').length;
  let lastDay = '';
  out.innerHTML = `<div class="hit" id="nameBack" style="color:var(--accent)">← back to recordings</div>
    <div class="meta" style="padding:4px 16px">${sure} for sure, ${hits.length - sure} that sound like it (marked ?)</div>`
    + hits.map((h, i) => {
      const day = (h.started_at || '').slice(0, 10), head = day !== lastDay ? `<div class="hit day">${day}</div>` : '';
      lastDay = day;
      const t = h.started_at ? new Date(new Date(h.started_at).getTime() + h.start * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : fmt(h.start);
      return head + `<div class="hit" data-i="${i}"><div class="meta">${t}${nameBadge(h.mention)}</div><div dir="auto">${hlName(esc(h.shown))}</div>${h.translation ? `<div class="en" dir="ltr">EN: ${esc(h.translation)}</div>` : ''}</div>`;
    }).join('');
  $('#nameBack').onclick = () => { out.hidden = true; $('#recs').hidden = false; };
  out.querySelectorAll('.hit[data-i]').forEach(el => el.onclick = () => { const h = hits[+el.dataset.i]; openRec(h.recording_id, h.start); });
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || !current) return;
  if (e.code === 'Space') { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
  if (e.code === 'ArrowLeft') audio.currentTime -= 5;
  if (e.code === 'ArrowRight') audio.currentTime += 5;
});

loadRecs().then(() => {
  const m = location.hash.match(/r=(\d+)/), t = location.hash.match(/t=(\d+)/);   // #r=3&t=8804 from the Days page
  if (m && recs.some(r => r.id === +m[1])) openRec(+m[1], t ? +t[1] : undefined);
});
</script>
</body>
</html>
